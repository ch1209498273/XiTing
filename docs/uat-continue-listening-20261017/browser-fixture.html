<!doctype html><html><meta name="viewport" content="width=device-width"><title>XiTing browser UAT</title><body><h1>Public browser audio sample</h1><p>Controlled compatibility fixture, not a streaming service.</p><audio id="audio" loop controls src="sample.wav"></audio><button onclick="play()">Play sample</button><script>
